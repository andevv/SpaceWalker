name: TestFlight Auto Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testflight-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-latest

    env:
      TZ: Asia/Seoul
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      BASE_URL: ${{ secrets.BASE_URL }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # -----------------------------
      # Secrets.swift 생성
      # -----------------------------
      - name: Generate Secrets.swift
        run: |
          mkdir -p SpaceWalker/Resources
          cat > SpaceWalker/Resources/Secrets.swift << EOF
          //
          // Auto-generated in CI
          //
          import Foundation
          enum Secrets {
              static let baseURL = "${BASE_URL}"
          }
          EOF

      # -----------------------------
      # GoogleService-Info.plist 생성 (Firebase/Crashlytics)
      # -----------------------------
      - name: Generate GoogleService-Info.plist
        run: |
          mkdir -p SpaceWalker/
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64}" ]; then
            echo "::error::Missing secret GOOGLE_SERVICE_INFO_PLIST_BASE64"
            exit 1
          fi
          ruby -rbase64 -e 'File.binwrite("SpaceWalker/GoogleService-Info.plist", Base64.decode64(ENV.fetch("GOOGLE_SERVICE_INFO_PLIST_BASE64")) )'

      # -----------------------------
      # Swift Package resolve
      # -----------------------------
      - name: Resolve SPM
        run: xcodebuild -resolvePackageDependencies -scheme SpaceWalker -project SpaceWalker.xcodeproj

      # -----------------------------
      # TestFlight deploy
      # -----------------------------
      - name: Upload to TestFlight
        run: bundle exec fastlane ios beta
